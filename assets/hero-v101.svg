<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Central de tecnologia GoldenAx</title>
<desc id="desc">Ilustração premium de uma central de operações de tecnologia com servidores, painéis e identidade dourada GoldenAx.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0e12"/><stop offset=".55" stop-color="#151a21"/><stop offset="1" stop-color="#050608"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1c75d"/><stop offset=".5" stop-color="#d99b1d"/><stop offset="1" stop-color="#9d6907"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#18334c"/><stop offset="1" stop-color="#07131e"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#d89a1c" stop-opacity=".34"/><stop offset="1" stop-color="#d89a1c" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".45"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1200" height="820" fill="url(#bg)"/>
<rect width="1200" height="820" fill="url(#grid)"/>
<circle cx="900" cy="190" r="310" fill="url(#glow)" filter="url(#blur)"/>
<!-- server racks -->
<g opacity=".88">
  <g transform="translate(42 82)"><rect width="180" height="650" rx="14" fill="#0b0d10" stroke="#343a43"/><rect x="18" y="25" width="144" height="600" rx="6" fill="#11161c"/>
    <g fill="#202832" stroke="#3b4654"><rect x="31" y="48" width="118" height="55" rx="4"/><rect x="31" y="120" width="118" height="55" rx="4"/><rect x="31" y="192" width="118" height="55" rx="4"/><rect x="31" y="264" width="118" height="55" rx="4"/><rect x="31" y="336" width="118" height="55" rx="4"/><rect x="31" y="408" width="118" height="55" rx="4"/><rect x="31" y="480" width="118" height="55" rx="4"/><rect x="31" y="552" width="118" height="45" rx="4"/></g>
    <g fill="#d99b1d"><circle cx="48" cy="75" r="4"/><circle cx="48" cy="147" r="4"/><circle cx="48" cy="219" r="4"/><circle cx="48" cy="291" r="4"/><circle cx="48" cy="363" r="4"/><circle cx="48" cy="435" r="4"/></g>
    <g fill="#5bc0ff"><circle cx="62" cy="75" r="3"/><circle cx="62" cy="147" r="3"/><circle cx="62" cy="219" r="3"/><circle cx="62" cy="291" r="3"/><circle cx="62" cy="363" r="3"/><circle cx="62" cy="435" r="3"/></g>
  </g>
  <g transform="translate(975 80)"><rect width="180" height="652" rx="14" fill="#0b0d10" stroke="#343a43"/><rect x="18" y="25" width="144" height="602" rx="6" fill="#11161c"/>
    <g fill="#202832" stroke="#3b4654"><rect x="31" y="48" width="118" height="55" rx="4"/><rect x="31" y="120" width="118" height="55" rx="4"/><rect x="31" y="192" width="118" height="55" rx="4"/><rect x="31" y="264" width="118" height="55" rx="4"/><rect x="31" y="336" width="118" height="55" rx="4"/><rect x="31" y="408" width="118" height="55" rx="4"/><rect x="31" y="480" width="118" height="55" rx="4"/><rect x="31" y="552" width="118" height="45" rx="4"/></g>
    <g fill="#d99b1d"><circle cx="48" cy="75" r="4"/><circle cx="48" cy="147" r="4"/><circle cx="48" cy="219" r="4"/><circle cx="48" cy="291" r="4"/><circle cx="48" cy="363" r="4"/><circle cx="48" cy="435" r="4"/></g>
  </g>
</g>
<!-- central workstation -->
<g filter="url(#shadow)">
  <rect x="260" y="132" width="680" height="470" rx="24" fill="#10151b" stroke="#49515d"/>
  <rect x="286" y="160" width="628" height="380" rx="13" fill="url(#screen)"/>
  <rect x="286" y="160" width="628" height="54" rx="13" fill="#111a23"/>
  <circle cx="318" cy="187" r="6" fill="#d99b1d"/><circle cx="338" cy="187" r="6" fill="#4c9ed9"/><circle cx="358" cy="187" r="6" fill="#83c778"/>
  <text x="392" y="193" fill="#e6e9ed" font-family="Arial, sans-serif" font-size="19" font-weight="700">GOLDENAX OPERATIONS</text>
  <!-- dashboard cards -->
  <g transform="translate(316 245)">
    <rect width="170" height="112" rx="10" fill="#111d28" stroke="#2c4152"/><text x="18" y="31" fill="#92a5b5" font-family="Arial" font-size="14">SYSTEMS ONLINE</text><text x="18" y="78" fill="#f1c75d" font-family="Arial" font-size="42" font-weight="700">98%</text>
    <rect x="194" width="170" height="112" rx="10" fill="#111d28" stroke="#2c4152"/><text x="212" y="31" fill="#92a5b5" font-family="Arial" font-size="14">SECURITY STATUS</text><path d="M250 55l22-10 22 10v18c0 17-10 29-22 36-12-7-22-19-22-36z" fill="none" stroke="#d99b1d" stroke-width="4"/><path d="M262 72l8 8 16-19" fill="none" stroke="#83c778" stroke-width="4"/>
    <rect x="388" width="170" height="112" rx="10" fill="#111d28" stroke="#2c4152"/><text x="406" y="31" fill="#92a5b5" font-family="Arial" font-size="14">RESPONSE</text><text x="406" y="77" fill="#fff" font-family="Arial" font-size="34" font-weight="700">FAST</text>
    <rect y="138" width="558" height="130" rx="10" fill="#0e1923" stroke="#2c4152"/>
    <polyline points="22,228 80,196 128,210 181,161 234,185 289,147 340,171 398,130 454,151 528,104" fill="none" stroke="#d99b1d" stroke-width="5"/>
    <g fill="#d99b1d"><circle cx="80" cy="196" r="5"/><circle cx="181" cy="161" r="5"/><circle cx="289" cy="147" r="5"/><circle cx="398" cy="130" r="5"/><circle cx="528" cy="104" r="5"/></g>
  </g>
  <path d="M510 602h180l28 58H482z" fill="#151a20" stroke="#414954"/><rect x="410" y="660" width="380" height="24" rx="12" fill="#0b0d10"/>
</g>
<!-- brand symbol -->
<g transform="translate(760 570)" filter="url(#shadow)">
  <rect width="260" height="155" rx="18" fill="#0b0d10" fill-opacity=".94" stroke="#d99b1d" stroke-opacity=".55"/>
  <path d="M42 43a32 32 0 1 0 20 57" fill="none" stroke="#f0f1f2" stroke-width="14" stroke-linecap="round"/>
  <path d="M69 102L99 40l31 62M83 76h32" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linejoin="round"/>
  <text x="145" y="70" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Golden<tspan fill="#d99b1d">Ax</tspan></text>
  <text x="145" y="101" fill="#aeb7c0" font-family="Arial" font-size="13">TECHNOLOGY WITH A HUMAN TOUCH</text>
</g>
<!-- diagonal identity accents -->
<path d="M315 -40L365 -40 180 860 130 860z" fill="url(#gold)"/>
<path d="M1120 -20L1165 -20 1010 850 965 850z" fill="url(#gold)"/>
</svg>